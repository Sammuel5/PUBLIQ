<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="PUBLIQ Super Club food and café menu">
  <meta name="application-name" content="PUBLIQ Super Club">
  <title>Menu · PUBLIQ Super Club</title>
  <link rel="icon" href="/assets/publiq-super-club-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/menu.css">
  <script src="/assets/menu.js" defer></script>
</head>
<body class="customer-menu">
  <header class="menu-header">
    <div class="menu-brand" id="menuBrand"><img class="menu-brand-icon" src="/assets/publiq-super-club-icon.svg" alt=""><span class="menu-brand-name">PUBLIQ Super Club</span></div>
    <div class="menu-header-note" id="menuHeaderNote">A menu made for you</div>
  </header>
  <main class="menu-main">
    <div id="offlineStatus" class="offline-status" role="status" aria-live="polite" hidden></div>
    <section class="restaurant-hero" id="restaurantHero">
      <div class="hero-cover" id="heroCover" hidden></div>
      <div class="hero-copy"><p class="menu-eyebrow" id="restaurantDescription">DIGITAL MENU</p><h1 id="restaurantName">Loading menu…</h1><p id="restaurantContact" class="restaurant-contact"></p><div id="menuVersion" class="menu-version"></div></div>
      <img id="restaurantLogo" class="restaurant-logo" alt="Restaurant logo" hidden>
    </section>
    <aside id="menuAnnouncement" class="menu-announcement" hidden></aside>
    <nav id="categoryNav" class="category-nav" aria-label="Menu categories" hidden></nav>
    <section id="menuContent" class="menu-content" aria-live="polite"><div class="menu-loading"><span class="menu-spinner" aria-hidden="true"></span><span>Preparing your menu…</span></div></section>
    <footer class="menu-footer"><span id="menuFooterBrand">Made with care</span><span id="syncStatus"></span></footer>
  </main>
</body>
</html>
